[build-system]
requires = ['hatchling>=1.26.3', "hatch-fancy-pypi-readme>=24.1.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "sinchole"
description = "Sampling-admitted intensity grids and windowed-sinc reads in JAX with unknown error bounds"
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["coronagraph", "sinc interpolation", "JAX", "Habitable Worlds Observatory", "direct imaging"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["jax>=0.8.1", "equinox>=0.13.2", "jaxtyping>=0.3.3"]

[project.optional-dependencies]
dev = ["pre-commit>=3.5.0"]
viz = ["eyepiece>=0.17.0", "matplotlib>=3.11.0", "numpy>=2.1.2"]
docs = [
    "eyepiece>=0.17.0",
    "hwostyle>=1.7.0",
    "sphinx>=7.2.0",
    "myst-nb>=1.0.0",
    "sphinx-book-theme>=1.1.0",
    "sphinx-autoapi>=3.0.0",
    "sphinxcontrib-mermaid>=0.9",
    "sphinx-design>=0.6.0",
    "ipykernel>=6.29.0",
    "ipython>=8.18.0",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.11.0",
]
test = [
    "eyepiece>=0.17.0",
    "pytest>=7.3.2",
    "hypothesis>=6.79.1",
    # The optional budget plugin uses psutil for portable memory sampling.
    "psutil>=5.9.4",
    "pytest-xdist>=3.8.0",
    "pytest-testmon>=2.0.7",
    "pytest-markdown-docs>=0.5.0",
    "pytest-timeout>=1.3.1",
    "pytest-fail-slow>=0.1.0",
    "hwoutils>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/CoreySpohn/sinchole"
Documentation = "https://sinchole.readthedocs.io"
Issues = "https://github.com/CoreySpohn/sinchole/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/sinchole/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# Docs example notebooks are teaching material: x64 config must precede the jax
# import (E402), and prose-length plotting lines and short names are fine here.
"docs/examples/*.ipynb" = ["E402", "E501", "E741", "B905", "D"]

[tool.hatch.build.targets.wheel]
packages = ["src/sinchole"]

[tool.hatch.build.targets.sdist]
exclude = ["/scripts", "/docs", "/tests", "/.github"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
markers = [
    "medium: tests with a 30-second default time budget",
    "slow: tests with a 300-second default time budget, run nightly",
]

[tool.testbudget]
library = "sinchole"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["sinchole"]
optional_dependencies_dev_groups = ["dev", "docs", "test"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/sinchole"]
