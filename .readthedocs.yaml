# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        # Install with the [docs] flag for sphinx docs specific extensions
        - docs

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
# Read the Docs installs released dependencies from PyPI only. CI builds the
# docs against the sibling pins in .github/sibling-pins.txt as well.
